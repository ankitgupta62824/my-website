            margin-bottom: 10px;
            background-color: #f8f9fa;
            color: #333;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid #eee;

        .social-links a i {

            font-size: 18px;
